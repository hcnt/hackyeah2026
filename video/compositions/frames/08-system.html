  tl.set("#s08-card", { xPercent: -50, yPercent: -50 }, 0);
  tl.fromTo("#s08-shk", { y: -4.5 }, { y: -4.5, duration: 0.01 }, 0);
  tl.fromTo("#s08-card", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 3.15);
  [0, 1, 2].forEach((i) => {
    const t = 3.85 + i * 0.4;
    tl.to(`#s08-card .cr:nth-child(${i + 2}) .ph`, { opacity: 0, duration: 0.15 }, t);
    tl.fromTo(`#s08-v${i}`, { opacity: 0, clipPath: "inset(0 0 0 100%)" }, { opacity: 1, clipPath: "inset(0 0 0 0%)", duration: 0.35, ease: "power2.out" }, t);
  });
  tl.to("#s08-shk", { y: 0, duration: 0.25, ease: "back.in(3)" }, 5.15);
  tl.fromTo("#s08-card", { scale: 1 }, { keyframes: { scale: [1, 1.04, 1] }, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.4);
  tl.to("#s08-card .tot .ph", { opacity: 0, duration: 0.15 }, 5.4);
  tl.fromTo("#s08-v3", { opacity: 0, clipPath: "inset(0 0 0 100%)" }, { opacity: 1, clipPath: "inset(0 0 0 0%)", duration: 0.35, ease: "power2.out" }, 5.4);
  // the locked card folds into the contract square
  tl.to("#s08-cin", { opacity: 0, duration: 0.2, ease: "power1.in" }, 5.75);
  tl.to("#s08-card", { width: 300, height: 300, duration: 0.4, ease: "power3.inOut" }, 5.8);
  tl.set("#s08-card", { opacity: 0 }, 6.2);
  tl.set("#s08-con", { opacity: 1 }, 6.0);
  tl.fromTo("#s08-con > *", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.0);

  // the contract drops to the bottom-left: first block of the chain (150px at 160,840)
  tl.to("#s08-con", { x: -725, y: 375, scale: 0.5, duration: 0.75, ease: "power3.inOut" }, 6.1);

  // the oracle network arrives at the top, empty
  tl.fromTo("#s08-net", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.7);

  // widgets stream in; each one sends its face to every node and its address onto the chain
  ['szymon', 'jaca', 'bzdon', 'face4'].forEach((n, i) => {
    const SLOW = [1.3, 1.15, 1, 1], S = 0.75 * SLOW[i];
    const t = 7.300000000000001 + 1.2 * SLOW.slice(0, i).reduce((a, b) => a + b, 0);
    const w = `#s08-fw${i}`;
    tl.set(w, { xPercent: -50, yPercent: -50, y: 540, scale: 0.8 }, 0);
    tl.fromTo(w, { x: 2150, opacity: 1 }, { x: 960, duration: 0.9 * S, ease: "power3.out" }, t);
    // the face splits into four copies that travel all the way into this person's slot on every node
    tl.set(`#s08-fwf${i}`, { opacity: 0 }, t + 1.0 * S);
    [0, 1, 2, 3].forEach((k) => {
      const sx = 421 + k * 330 + (i % 2) * 88, sy = 148 + Math.floor(i / 2) * 88;
      const go = t + 1.0 * S + k * 0.07 * S, land = go + 0.75 * S;
      const f = `#s08-fly${i}-${k}`;
      tl.fromTo(f, { xPercent: -50, yPercent: -50, x: 960, y: 492, scale: 1, opacity: 0 }, { opacity: 1, duration: 0.01 }, go);
      tl.to(f, { x: sx, y: sy, scale: 0.8, duration: 0.75 * S, ease: "power2.inOut" }, go);
      tl.to(f, { opacity: 0, duration: 0.06 * S }, land);
      tl.fromTo(`#s08-net .col:nth-child(${k + 1}) .s08-nf${i}`, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.2 * S, ease: "back.out(2)" }, land);
    });
    // the widget empties out; its address drops down and links onto the chain
    tl.to(w, { opacity: 0, scale: 0.6, duration: 0.35 * S, ease: "power2.in" }, t + 1.1 * S);
    const cx = [370, 580, 790, 1000][i];
    tl.fromTo(`#s08-cb${i}`, { opacity: 0, x: 885 - cx, y: -300, scale: 0.6 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6 * S, ease: "power3.inOut" }, t + 1.15 * S);
    tl.fromTo(`#s08-lk${i}`, { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.25 * S, ease: "power2.out" }, t + 1.75 * S);
  });

  window.__timelines["s08-system"] = tl;
</script>

# One app stack. Run with a project name and matching STACK, e.g.
#   STACK=prod  docker compose -p prod  up -d --build
#   STACK=pr-12 docker compose -p pr-12 up -d --build
# The edge router (edge/compose.yaml) must be up first; it owns the "edge" network.
services:
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    networks:
      default: {}
      edge:
        aliases:
          - ${STACK:-prod}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    # Prod's .env is written by deploy.yml from the repo's GitHub variables and secrets (e.g. ORACLE_KEYPAIR);
    # previews and local runs have none and fall back to the defaults in backend/app/config.py.
    env_file:
      - path: .env
        required: false
    environment:
      ENV: ${ENV:-prod}
    restart: unless-stopped

networks:
  edge:
    external: true

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue the newer one instead of cancelling mid-deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://hackyeah.kindhome.io
    env:
      DIR: /opt/hackyeah2026
      TARGET: root@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Sync code
        # .env lives only on the server. Excluded paths are also protected from --delete.
        run: |
          rsync -az --delete \
            --exclude .git --exclude .github --exclude .env \
            --exclude node_modules --exclude dist --exclude .venv --exclude __pycache__ \
            ./ "$TARGET:$DIR/"

      - name: Deploy (edge router + prod stack, then health check)
        run: ssh "$TARGET" "$DIR/scripts/deploy-prod.sh"
